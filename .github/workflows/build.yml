name: Build

on:
  push:
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate gradle wrapper
        uses: gradle/wrapper-validation-action@v1
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Cache MTR dependencies
        uses: actions/cache@v3
        with:
          path: checkouts/
          key: mtr-deps-${{ hashFiles('gradle.properties') }}
          restore-keys: mtr-deps-
      - name: Setup MTR dependencies
        run: ./gradlew setupLibrary --no-daemon
      - name: Build project
        run: ./gradlew build --no-daemon
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MTR-Russian-Metro-Addon-artifacts
          path: build/release/*.jar
